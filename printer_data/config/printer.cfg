#####################################################################
# Ender 3 V2
# SKR Mini E3 V3
# EBB36 CAN
# Sherpa Mini
# BLTouch
#####################################################################

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 2500
max_z_velocity: 10
max_z_accel: 150
square_corner_velocity: 5.0

#####################################################################
#   Configurações do motor de passo X
#####################################################################

######
# Motor -XM
# Batente - X-STOP
###############
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 32
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 225
homing_speed: 70

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.58
interpolate: False
stealthchop_threshold: 0

#####################################################################
#   Configurações do Motor de Passo Y
#####################################################################
######
# Motor -YM
# Fim de Curso - Parada Y
###############
[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PC1
position_endstop: 0
position_max: 225
homing_speed: 70

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.58
interpolate: False
stealthchop_threshold: 0

#####################################################################
#   Configurações do Motor de Passo Z
#####################################################################
######
# Motor -ZAM
# Fim de Curso - Z-STOP
###############
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 32
rotation_distance: 8
full_steps_per_rotation: 200
# endstop_pin: ^PC2
#position_endstop: 0.0
endstop_pin: probe:z_virtual_endstop
position_max: 250
homing_speed: 20
position_min: -3.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.65
interpolate: False
stealthchop_threshold: 0

#####################################################################
#  Configurações da extrusora
#####################################################################
######
#Motor - EM
###############
[extruder]
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1
enable_pin: !EBBCan:PD2
microsteps: 32
gear_ratio: 50:10
rotation_distance: 22.6789511
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: EBBCan:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBCan:PA3
min_temp: 10
max_temp: 270
max_power: 1.0
min_extrude_temp: 170
max_extrude_cross_section: 10
#Defina adequadamente após calibrar sua impressora
#pressure_advance: .05
##	O padrão é 0,040, deixe como está
# pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 100.0

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.7
hold_current: 0.3
interpolate: False

#####################################################################
#   Aquecedor de cama
#####################################################################
######
# Conector de cama
###############
[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

#####################################################################
#   BLTOUCH
#####################################################################
######
#Conector Z Max na placa Z (principal)
#Sonda indutiva
###############
[bltouch]
sensor_pin: ^EBBCan:PB8
control_pin: EBBCan:PB9
x_offset: 40
y_offset: -0.6
#z_offset: 0
samples: 3
samples_result: median
sample_retract_dist: 3
samples_tolerance: 0.03
samples_tolerance_retries: 3

#####################################################################
#   Tela de localização e cama
#####################################################################
[safe_z_home]
home_xy_position: 77.5,117.5
speed: 100
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 45,35
mesh_max: 220,220
probe_count: 6,6
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[screws_tilt_adjust]
screw1: -10,35
screw1_name: frente esquerda

screw2: 135,35
screw2_name: frente direita

screw3: 135,195
screw3_name: trás direita

screw4: -10,195
screw4_name: trás esquerda

horizontal_move_z: 5
speed: 150
screw_thread: CCW-M4

#####################################################################
#   Controle do ventilador
#####################################################################
######
# Ventilador de eletrônicos
###############
[controller_fan controller_fan] #fanskr
pin: PB15
heater: extruder
fan_speed: 1.0
idle_timeout: 300

[output_pin pi_fan] #fanpi
pin: PC7
value: 1
shutdown_value: 1

[heater_fan hotend_fan] #fanhotend
pin: EBBCan:PA0
heater: extruder
heater_temp: 50.0

[fan] #fanpeças
pin: EBBCan:PA1

#####################################################################
#   MCU
#####################################################################
######
# MCU EBBCan
# MCU SKR MINI E3 3.0
###############
[mcu EBBCan]
canbus_uuid: dfe6c05aa9c5

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_0A00250004504E5238363120-if00

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

#####################################################################
#   Input_Shaper
#####################################################################

[input_shaper]
#shaper_freq_x: 81.2
#shaper_type_x: 3hump_ei
#shaper_freq_y: 33.6
#shaper_type_y: mzv

#####################################################################
#   Includes
#####################################################################

[include mainsail.cfg]
[include macros.cfg]
[include moonraker_obico_macros.cfg]

# === KAMP ===
[include KAMP_Settings.cfg]
[include ./KAMP/Adaptive_Meshing.cfg]
[include ./KAMP/Line_Purge.cfg]
[include ./KAMP/Smart_Park.cfg]

# === Mainsail ===
[exclude_object]

# === Input Shaper ===
#[include accelerometer.cfg]

#####################################################################
#   Exibições
######################################################################

[display]
lcd_type: emulated_st7920
spi_software_miso_pin: PD8 # status led, Virtual MISO
spi_software_mosi_pin: PD6
spi_software_sclk_pin: PB9
en_pin: PB8
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15

[output_pin beeper]
pin: PB5

[gcode_macro T0]
gcode:
# Ignora comando de troca de ferramenta

[gcode_arcs]
resolution: 0.1


